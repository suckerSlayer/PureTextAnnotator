[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-text-annotator"
version = "0.6.0"
description = "A keyboard-first terminal annotator for text, Markdown, and text-layer PDFs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pdfplumber==0.11.8",
    "platformdirs==4.4.0",
    "pypdf==6.21.4",
    "PyYAML==6.0.3",
    "textual==8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
pta-embed = "pure_text_annotator.embed_cli:main"
pta-view = "pure_text_annotator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

