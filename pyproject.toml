[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-text-annotator"
version = "0.1.0"
description = "A keyboard-first terminal viewer for plain text and Markdown files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual==8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
pta-view = "pure_text_annotator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

